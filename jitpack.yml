# JitPack build config — silknet-ds is a multi-platform repo (web/iOS/Android),
# so JitPack needs to know to build the Android Gradle module specifically.
#
# We invoke gradle with `-p android` (project dir) instead of `cd android &&`
# because earlier attempts with `cd` failed with "No such file or directory"
# in JitPack's build environment. Using `-p` keeps the working directory at
# the repo root, which JitPack expects.
#
# Consumer reference:
#   implementation 'com.github.tamashebistvis333-lgtm:silknet-ds:vX.Y.Z'

jdk:
  - openjdk17

install:
  - chmod +x android/gradlew && android/gradlew -p android :library:publishToMavenLocal -PVERSION_NAME=$VERSION
