name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Note: we deliberately skip `npm run import` here — that step reads
      # from the designer's local ~/Desktop/Tokens/. CI uses the already-
      # normalized tokens committed under tokens/.
      - name: Build packages (Style Dictionary + tokens + react)
        run: npm run build:packages

      - name: Generate Swift package sources
        run: npm run build:swift

      - name: Verify committed Swift sources match generated output
        run: |
          if ! git diff --exit-code Sources/SilknetDS/; then
            echo "::error::Swift sources are out of date. Run \`npm run build:swift\` and commit the result."
            exit 1
          fi

      - name: Generate Android library sources
        run: npm run build:android

      - name: Verify committed Android sources match generated output
        run: |
          if ! git diff --exit-code android/library/src/main/kotlin/ android/library/src/main/res/; then
            echo "::error::Android sources are out of date. Run \`npm run build:android\` and commit the result."
            exit 1
          fi

      - name: Generate playground token data
        run: npm run build:playground-data

      - name: Verify committed playground data matches generated output
        run: |
          if ! git diff --exit-code apps/playground/src/_data/; then
            echo "::error::Playground token data is out of date. Run \`npm run build:playground-data\` and commit the result."
            exit 1
          fi

      - name: Type-check React package
        run: npm run typecheck

      - name: Type-check playground stories
        run: npx tsc --noEmit
        working-directory: apps/playground
