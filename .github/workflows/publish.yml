name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Sources/SilknetDS/* is committed (Swift Package); web packages need a build first.
      - name: Build web packages
        run: npm run build:packages

      # Publish each package only if its current package.json version isn't
      # already on npm — lets us tag a release that bumps only one of the
      # packages without the workflow failing on "cannot publish over the
      # previously published version".
      - name: Publish @silknet-ds/tokens (if new)
        run: |
          v=$(node -p "require('./packages/tokens/package.json').version")
          if npm view "@silknet-ds/tokens@$v" version >/dev/null 2>&1; then
            echo "@silknet-ds/tokens@$v already published — skipping."
          else
            npm publish -w @silknet-ds/tokens --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @silknet-ds/react (if new)
        run: |
          v=$(node -p "require('./packages/react/package.json').version")
          if npm view "@silknet-ds/react@$v" version >/dev/null 2>&1; then
            echo "@silknet-ds/react@$v already published — skipping."
          else
            npm publish -w @silknet-ds/react --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
